name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, ubuntu-22.04, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    # Install EGL/Mesa prerequisites only on Ubuntu
    - name: Install EGL/Mesa prerequisites
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        
        # 1. Spin up the virtual framebuffer server globally first
        sudo apt-get install -y xvfb
        
        Xvfb :99 -screen 0 1024x768x24 &
        export DISPLAY=:99
        sleep 1
        
        # 2. Expose Software Rendering (Lavapipe) flags to the installer
        export VK_LOADER_DRIVERS_DISABLE=all
        export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        export DUMMY_DRIVER=1
        
        sudo -E apt-get install -y \
          mesa-utils \
          libegl1 \
          libegl-dev \
          libgles2 \
          libgles2-mesa-dev \
          libgl1-mesa-dev \
          libgl1-mesa-dri \
          libgbm-dev \
          libdrm-dev \
          libopenxr1-monado \
          libosmesa6-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          # openxr-utils \
          # monado-cli \
          monado-service
    - name: Install dependencies 1
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
    - name: Install dependencies 2
      run: |
        python -m pip install -e .
    - name: Force Mesa software rendering
      if: runner.os == 'Linux'
      run: |
        echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV
        echo "EGL_PLATFORM=surfaceless" >> $GITHUB_ENV
    - name: Test installed code with pytest
      run: |
        pytest
